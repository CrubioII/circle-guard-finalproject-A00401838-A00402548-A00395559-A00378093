# Escaneo de secretos en cada PR (US-26, CA1).
# gitleaks revisa los commits nuevos del PR (base..head), no todo el historial: lo que
# ya está en main no bloquea, pero ningún PR puede agregar una credencial. Falla con
# el archivo, la línea y la regla; el valor sale enmascarado (--redact).
# Los falsos positivos conocidos están en .gitleaks.toml con su justificación.
name: secret-scan

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (commits del PR)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo:ro" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --no-banner --redact --verbose --config /repo/.gitleaks.toml \
            --log-opts="${BASE_SHA}..${HEAD_SHA}"
