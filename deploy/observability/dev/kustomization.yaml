# Observabilidad del ambiente dev (US-24 / SCRUM-93).
#   kubectl apply -k deploy/observability/dev
# Está fuera de observability/ porque kustomize no acepta una base que contenga
# a sus propios overlays (con overlays/ adentro, el render fallaba por ciclo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../observability

patches:
  # La política de scrape vive en el namespace de la aplicación del ambiente.
  - target:
      kind: NetworkPolicy
      name: allow-prometheus-scrape
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: circleguard-dev
  # Retención de logs: 7 días, igual que los log groups de CloudWatch del ambiente.
  - target:
      kind: StatefulSet
      name: loki
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: 168h

labels:
  - pairs:
      circleguard.io/environment: dev
    includeSelectors: false
    includeTemplates: true
