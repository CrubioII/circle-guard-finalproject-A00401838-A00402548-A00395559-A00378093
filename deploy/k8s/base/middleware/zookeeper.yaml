# Zookeeper 7.6.0 (Confluent): coordinación de Kafka.
# Guarda datos en disco: si Kafka persiste y Zookeeper no, Kafka no vuelve a
# arrancar (InconsistentClusterIdException).
apiVersion: v1
kind: Service
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: coordination
spec:
  clusterIP: None
  # Kafka necesita resolver "zookeeper" mientras Zookeeper aún arranca; sin esto
  # el nombre no existe hasta que pasa la readinessProbe (UnknownHostException).
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: zookeeper
  ports:
    - name: client
      port: 2181
      targetPort: client
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: zookeeper
  labels:
    app.kubernetes.io/name: zookeeper
    app.kubernetes.io/component: coordination
spec:
  serviceName: zookeeper
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zookeeper
        app.kubernetes.io/component: coordination
    spec:
      # La imagen de Confluent toma ZOOKEEPER_* como configuración.
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        # La imagen corre como appuser (1000).
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.6.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: client
              containerPort: 2181
          env:
            - name: ZOOKEEPER_CLIENT_PORT
              value: "2181"
            - name: ZOOKEEPER_TICK_TIME
              value: "2000"
            - name: KAFKA_HEAP_OPTS
              valueFrom:
                configMapKeyRef:
                  name: middleware-config
                  key: ZOOKEEPER_HEAP_OPTS
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 250m
              memory: 384Mi
          readinessProbe:
            exec:
              command: ["sh", "-c", "echo srvr | nc -w 2 localhost 2181 | grep -q Mode"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/zookeeper/data
              subPath: data
            - name: data
              mountPath: /var/lib/zookeeper/log
              subPath: log
            - name: logs
              mountPath: /var/log/kafka
            - name: config
              mountPath: /etc/kafka
      volumes:
        - name: config
          emptyDir: {}
        - name: logs
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
