# notification-service (8082): Consume eventos de Kafka y envía notificaciones. Sin API pública.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notification-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notification-service
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: notification-service
          image: circleguard/notification-service:0.1.0
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          ports:
            - {name: http, containerPort: 8082}
          envFrom:
            - configMapRef: {name: services-config}
            - configMapRef: {name: notification-service-config}
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector:
    app.kubernetes.io/name: notification-service
  ports:
    - {name: http, port: 8082, targetPort: http}
