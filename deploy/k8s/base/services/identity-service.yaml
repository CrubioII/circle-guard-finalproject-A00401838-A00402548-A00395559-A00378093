# identity-service (8083): Bóveda de identidades: cifra y seudonimiza los datos personales.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity-service
    spec:
      serviceAccountName: identity-service
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: identity-service
          image: circleguard/identity-service:0.1.0
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          ports:
            - {name: http, containerPort: 8083}
          envFrom:
            - configMapRef: {name: services-config}
            - configMapRef: {name: identity-service-config}
          env:
            - {name: SPRING_DATASOURCE_USERNAME, valueFrom: {secretKeyRef: {name: circleguard-middleware, key: POSTGRES_USER}}}
            - {name: SPRING_DATASOURCE_PASSWORD, valueFrom: {secretKeyRef: {name: circleguard-middleware, key: POSTGRES_PASSWORD}}}
            - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: circleguard-app, key: JWT_SECRET}}}
            - {name: VAULT_SECRET, valueFrom: {secretKeyRef: {name: circleguard-app, key: VAULT_SECRET}}}
            - {name: VAULT_SALT, valueFrom: {secretKeyRef: {name: circleguard-app, key: VAULT_SALT}}}
            - {name: VAULT_HASHSALT, valueFrom: {secretKeyRef: {name: circleguard-app, key: VAULT_HASH_SALT}}}
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
spec:
  selector:
    app.kubernetes.io/name: identity-service
  ports:
    - {name: http, port: 8083, targetPort: http}
