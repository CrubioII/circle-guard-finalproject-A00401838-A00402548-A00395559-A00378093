# HorizontalPodAutoscaler (US-38, entregable E2.2).
# k3s trae metrics-server, que da el uso de CPU de cada pod. El HPA compara ese uso con
# lo pedido (requests.cpu: 100m del parche común) y agrega réplicas al pasar el 70 %.
# Solo se escalan los servicios que reciben las peticiones de las pruebas de carga de
# US-27 (gateway valida el acceso, form recibe los cuestionarios y promotion procesa sus
# eventos). El máximo de 3 réplicas cabe en la ResourceQuota del namespace (1800m de
# CPU pedida): 3 servicios x 2 réplicas extra x 100m = 600m adicionales.
# behavior.scaleDown espera 5 minutos para no quitar réplicas en cada pico corto.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gateway-service}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: form-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: form-service}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: promotion-service
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: promotion-service}
  minReplicas: 1
  maxReplicas: 3
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
