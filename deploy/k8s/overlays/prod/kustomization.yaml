# CircleGuard — Ambiente prod (US-21)
# Namespace circleguard-prod en el clúster circleguard-prod-k3s (US-20).
# Límites de deploy/compose/docker-compose.prod.yml y más disco (nodo de 50 GB).
#   kubectl apply -k deploy/k8s/overlays/prod
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-prod

resources:
  - ../../base

components:
  - ../../components/prod-sizing

labels:
  - pairs:
      circleguard.io/environment: prod
    includeSelectors: false
    includeTemplates: true

configMapGenerator:
  - name: middleware-config
    behavior: merge
    literals:
      - POSTGRES_DB=circleguard_prod
      - LDAP_ORGANISATION=CircleGuard-prod
      - LDAP_DOMAIN=prod.circleguard.edu
      - LDAP_BASE_DN=dc=prod,dc=circleguard,dc=edu
      - KAFKA_LOG_RETENTION_HOURS=168

  # Configuración de los microservicios en este ambiente (US-37).
  - name: services-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - CG_ENVIRONMENT=prod
      - LOGGING_LEVEL_COM_CIRCLEGUARD=INFO

patches:
  # Host del Ingress de este ambiente (US-37), su certificado y la redirección a HTTPS (US-26).
  - target: {kind: Ingress, name: circleguard-api}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.prod.circleguard.edu
      - op: replace
        path: /spec/tls/0/hosts/0
        value: api.prod.circleguard.edu
      - op: replace
        path: /metadata/annotations/traefik.ingress.kubernetes.io~1router.middlewares
        value: circleguard-prod-redirect-https@kubernetescrd
  - target: {kind: Certificate, name: circleguard-api-tls}
    patch: |-
      - op: replace
        path: /spec/dnsNames/0
        value: api.prod.circleguard.edu
  - target: {kind: Certificate, name: circleguard-ca}
    patch: |-
      - op: replace
        path: /spec/commonName
        value: CircleGuard prod CA
  - path: storage.yaml
