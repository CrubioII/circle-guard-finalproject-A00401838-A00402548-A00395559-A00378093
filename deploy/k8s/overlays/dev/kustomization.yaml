# CircleGuard — Ambiente dev (US-21)
# Namespace circleguard-dev en el clúster circleguard-dev-k3s (US-20).
# Usa los tamaños de la base: nodo con disco de 30 GB.
#   kubectl apply -k deploy/k8s/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-dev

resources:
  - ../../base

labels:
  - pairs:
      circleguard.io/environment: dev
    includeSelectors: false
    includeTemplates: true

configMapGenerator:
  - name: middleware-config
    behavior: merge
    literals:
      - POSTGRES_DB=circleguard_dev
      - LDAP_ORGANISATION=CircleGuard-dev
      - LDAP_DOMAIN=dev.circleguard.edu
      - LDAP_BASE_DN=dc=dev,dc=circleguard,dc=edu
      - KAFKA_LOG_RETENTION_HOURS=72
  # Configuración de los microservicios en este ambiente (US-37).
  - name: services-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=dev
      - CG_ENVIRONMENT=dev
      - LOGGING_LEVEL_COM_CIRCLEGUARD=DEBUG

patches:
  # Host del Ingress de este ambiente (US-37).
  - target: {kind: Ingress, name: circleguard-api}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.dev.circleguard.edu
