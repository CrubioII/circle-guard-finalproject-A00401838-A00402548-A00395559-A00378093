# Disco por componente en stage (nodo de 40 GB; 14 Gi en volúmenes).
# volumeClaimTemplates no se fusiona: cada parche repite la plantilla completa.
# Es inmutable en un StatefulSet ya creado (ver docs/arquitectura/KUBERNETES_PLATAFORMA_US21.md).
apiVersion: v1
kind: ResourceQuota
metadata:
  name: environment-quota
spec:
  hard:
    requests.storage: 18Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 4Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
spec:
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 3Gi}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: {requests: {storage: 4Gi}}
