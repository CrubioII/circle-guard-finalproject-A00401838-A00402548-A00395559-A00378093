# CircleGuard — Ambiente stage (US-21)
# Namespace circleguard-stage en el clúster circleguard-stage-k3s (US-20).
# Réplica de prod para las pruebas E2E: mismos límites que prod y menos disco
# (nodo de 40 GB).
#   kubectl apply -k deploy/k8s/overlays/stage
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: circleguard-stage

resources:
  - ../../base

components:
  - ../../components/prod-sizing

labels:
  - pairs:
      circleguard.io/environment: stage
    includeSelectors: false
    includeTemplates: true

configMapGenerator:
  - name: middleware-config
    behavior: merge
    literals:
      - POSTGRES_DB=circleguard_stage
      - LDAP_ORGANISATION=CircleGuard-stage
      - LDAP_DOMAIN=stage.circleguard.edu
      - LDAP_BASE_DN=dc=stage,dc=circleguard,dc=edu
      - KAFKA_LOG_RETENTION_HOURS=120

  # Configuración de los microservicios en este ambiente (US-37).
  - name: services-config
    behavior: merge
    literals:
      - SPRING_PROFILES_ACTIVE=stage
      - CG_ENVIRONMENT=stage
      - LOGGING_LEVEL_COM_CIRCLEGUARD=INFO

patches:
  # Host del Ingress de este ambiente (US-37).
  - target: {kind: Ingress, name: circleguard-api}
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: api.stage.circleguard.edu
  - path: storage.yaml
