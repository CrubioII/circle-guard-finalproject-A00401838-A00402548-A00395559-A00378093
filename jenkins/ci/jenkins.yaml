# =============================================================================
# Jenkins Configuration as Code (JCasC) — CircleGuard
# Historia de Usuario: US-30 (SCRUM-113 / SCRUM-57)
#
# Declara, de forma reproducible:
#   1. La Shared Library global 'circleguard-shared-lib' (US-09).
#   2. El servidor GitHub usado por GitHub Branch Source.
#   3. El job Multibranch 'circleguard-monorepo' que descubre ramas y PRs,
#      usa el Jenkinsfile raíz y publica estados en GitHub.
#
# Aplicación:
#   1. Al arrancar Jenkins: exporta CASC_JENKINS_CONFIG=<ruta absoluta>/jenkins/ci/jenkins.yaml
#      (o configura -Dcasc.jenkins.config=...).
#   2. Para recargar tras un cambio (como admin; con un API token, no con la contraseña):
#      java -jar jenkins-cli.jar -s "${JENKINS_URL}" -auth admin:"${JENKINS_ADMIN_API_TOKEN}" \
#           reload-jcasc-configuration
# (o UI: Manage Jenkins -> Configuration as Code -> Reload existing configuration)
#
# Prerrequisitos (plugins): configuration-as-code, job-dsl, workflow-aggregator,
# workflow-multibranch, github, github-branch-source, pipeline-githubnotify-step,
# credentials-binding, matrix-auth (US-31).
# Credenciales requeridas (creadas fuera del repositorio, nunca versionadas):
#   - github-token       (Secret text con PAT; API del servidor GitHub y Branch Source).
#   - github-credentials (Username with password: usuario + PAT; clonado de la libreria
#                         y paso githubNotify).
#   - nexus-credentials  (Username with password: publicación de imágenes, US-11, y
#                         descarga en los nodos de ambiente durante el despliegue, US-13).
#   - circleguard-env-ssh (SSH Username with private key: usuario ec2-user + llave de los
#                         nodos dev/stage de US-05; despliegue y túneles E2E de US-13).
# Variables de entorno esperadas por este archivo. Las pasa docker-compose.ci.yml desde
# infra/bootstrap/.env.ci, que bootstrap-ci.sh genera con permisos 0600 y nunca se versiona:
#   - JENKINS_URL.
#   - Seguridad (US-31): JENKINS_ADMIN_PASSWORD y JENKINS_PWD_<USUARIO>, una por cuenta.
#   - Hosts (US-13): CG_DEV_HOST, CG_STAGE_HOST, CG_PROD_HOST y CG_REGISTRY_URL.
#   - Aprobación de prod (US-31): CG_PROD_APPROVERS (IDs de la lista de usuarios de abajo;
#     vacío = release a prod omitido) y CG_PROD_APPROVAL_TIMEOUT_MIN (60).
# Estas variables se declaran aquí y no en la UI: JCasC reemplaza globalNodeProperties en cada
# arranque, así que un valor escrito a mano en Manage Jenkins -> System se perdería.
#
# Seguridad (US-31, docs/operaciones/JENKINS_SEGURIDAD_US31.md):
#   - Cuentas locales sin registro público. JCasC reaplica las contraseñas en cada arranque:
#     para cambiar una se edita .env.ci y se reinicia Jenkins.
#   - Autorización por matriz (matrix-auth): solo 'admin' administra, el equipo lanza y
#     cancela builds, 'docente' solo lee y el usuario anónimo no tiene ningún permiso.
#     Los webhooks /github-webhook/ y /sonarqube-webhook/ no requieren sesión.
# =============================================================================
jenkins:
  # US-31: cuentas locales. Las contraseñas vienen del entorno, y docker-compose.ci.yml no
  # arranca Jenkins si falta alguna (${VAR:?}): nunca se crea una cuenta con contraseña vacía.
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          name: "Administrador CircleGuard (emergencia)"
          password: "${JENKINS_ADMIN_PASSWORD}"
        - id: "jrubio"
          name: "Juan Camilo Rubio Arboleda"
          password: "${JENKINS_PWD_JRUBIO}"
        - id: "ecuellar"
          name: "Esteban Cuéllar"
          password: "${JENKINS_PWD_ECUELLAR}"
        - id: "scastillo"
          name: "Santiago Castillo"
          password: "${JENKINS_PWD_SCASTILLO}"
        - id: "jpordonez"
          name: "Juan Pablo Ordóñez"
          password: "${JENKINS_PWD_JPORDONEZ}"
        - id: "docente"
          name: "Docente (solo lectura)"
          password: "${JENKINS_PWD_DOCENTE}"

  # US-31: autorización por matriz. Solo 'admin' tiene Overall/Administer: consola de scripts,
  # credenciales y configuración, que con el socket de Docker montado equivale a root en el host.
  # El equipo lanza y cancela builds y responde el input de prod. Run/Replay y Job/Configure
  # quedan fuera porque permitirían ejecutar código propio con las credenciales del pipeline.
  # Quién puede APROBAR prod lo decide CG_PROD_APPROVERS (el pipeline valida la lista).
  authorizationStrategy:
    globalMatrix:
      entries:
        - user:
            name: "admin"
            permissions:
              - "Overall/Administer"
        - group:
            name: "authenticated"
            permissions:
              - "Overall/Read"
              - "Job/Read"
              - "View/Read"
        - user:
            name: "jrubio"
            permissions:
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Run/Update"
        - user:
            name: "ecuellar"
            permissions:
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Run/Update"
        - user:
            name: "scastillo"
            permissions:
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Run/Update"
        - user:
            name: "jpordonez"
            permissions:
              - "Job/Build"
              - "Job/Cancel"
              - "Job/Workspace"
              - "Run/Update"

  systemMessage: |
    CircleGuard CI — Pipeline Multibranch (US-30)
    Repositorio: CrubioII/circle-guard-finalproject-A00401838-A00402548-A00395559-A00378093
    Shared Library: circleguard-shared-lib (US-09)
  numExecutors: 2
  scmCheckoutRetryCount: 2
  quietPeriod: 5
  # Repositorio base usado por publishBuildStatus aun en PRs provenientes de forks.
  globalNodeProperties:
    - envVars:
        env:
          - key: "CIRCLEGUARD_REPOSITORY"
            value: "CrubioII/circle-guard-finalproject-A00401838-A00402548-A00395559-A00378093"
          - key: "SONAR_PROJECT_KEY"
            value: "circleguard-monorepo"
          # Clave de test para el perfil de pruebas de identity-service; el
          # application.yml de test no define jwt.secret. No es un secreto real.
          - key: "JWT_SECRET"
            value: "circleguard-ci-test-secret-32-chars-long-123456"
          # US-13 / US-31: hosts de los ambientes y compuerta de prod, tomados de .env.ci.
          - key: "CG_DEV_HOST"
            value: "${CG_DEV_HOST:-52.15.165.116}"
          - key: "CG_STAGE_HOST"
            value: "${CG_STAGE_HOST:-52.14.89.125}"
          - key: "CG_PROD_HOST"
            value: "${CG_PROD_HOST:-77.113.211.62}"
          - key: "CG_REGISTRY_URL"
            value: "${CG_REGISTRY_URL:-18.117.90.15:5000}"
          - key: "CG_PROD_APPROVERS"
            value: "${CG_PROD_APPROVERS:-}"
          - key: "CG_PROD_APPROVAL_TIMEOUT_MIN"
            value: "${CG_PROD_APPROVAL_TIMEOUT_MIN:-60}"

unclassified:
  location:
    url: "${JENKINS_URL}"
    adminAddress: "devops@circleguard.edu"

  # Integración con SonarQube (US-10 / SCRUM-22 / SCRUM-58):
  # Usa la credencial Secret text 'sonar-token' y recibe el webhook de retorno
  # en ${JENKINS_URL}/sonarqube-webhook/ para resolver waitForQualityGate.
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube"
        serverUrl: "${SONAR_HOST_URL:-http://localhost:9000}"
        credentialsId: "sonar-token"
        triggers:
          skipScmCause: false
          skipUpstreamCause: false

  # Servidor GitHub usado por el GitHub Branch Source plugin para descubrir
  # ramas y Pull Requests. manageHooks=false porque el webhook se registra de
  # forma explícita e idempotente con jenkins/ci/setup-github-webhook.sh.
  githubpluginconfig:
    configs:
      - name: "GitHub"
        apiUrl: "https://api.github.com"
        credentialsId: "github-token"
        manageHooks: false

  # Shared Library global consumida por el Jenkinsfile mediante
  # @Library('circleguard-shared-lib') _. Vive en jenkins/vars/ de este monorepo;
  # el defaultVersion apunta a main (rama estable). allowVersionOverride permite
  # probar una rama puntual con @Library('circleguard-shared-lib@feature/...').
  globalLibraries:
    libraries:
      - name: "circleguard-shared-lib"
        defaultVersion: "main"
        allowVersionOverride: true
        includeInChangesets: false
        retriever:
          modernSCM:
            # La librería vive en jenkins/vars/ dentro del monorepo; libraryPath
            # hace que Jenkins use jenkins/ como raíz de la librería.
            libraryPath: "jenkins"
            scm:
              git:
                remote: "https://github.com/CrubioII/circle-guard-finalproject-A00401838-A00402548-A00395559-A00378093.git"
                credentialsId: "github-credentials"
                traits:
                  - "gitBranchDiscovery"

jobs:
  # Job Multibranch: descubre todas las ramas (CA2) y todos los Pull Requests
  # (abiertos y actualizados). Cada build ejecuta el Jenkinsfile raíz, que
  # diferencia el flujo PR vs. main y publica el Commit Status en GitHub (CA3).
  - script: |
      multibranchPipelineJob('circleguard-monorepo') {
        displayName('CircleGuard Monorepo — Multibranch')
        description('Pipeline CI de CircleGuard (8 microservicios + cliente web Expo). ' +
                    'Consume la Shared Library circleguard-shared-lib y publica estados en GitHub. ' +
                    'Trazabilidad: US-30 / SCRUM-113 / SCRUM-56 / SCRUM-57.')

        branchSources {
          branchSource {
            source {
              github {
                id('circleguard-github')
                repoOwner('CrubioII')
                repository('circle-guard-finalproject-A00401838-A00402548-A00395559-A00378093')
                repositoryUrl('https://github.com/CrubioII/circle-guard-finalproject-A00401838-A00402548-A00395559-A00378093.git')
                configuredByUrl(false)
                credentialsId('github-credentials')

                traits {
                  // 1 = descubrir las ramas normales y excluir las que ya se
                  // construyen como PR (evita builds duplicados).
                  gitHubBranchDiscovery {
                    strategyId(1)
                  }
                  // 1 = construir el merge del PR con su rama destino (main).
                  // Garantiza que el CI valide exactamente lo que se integrará.
                  gitHubPullRequestDiscovery {
                    strategyId(1)
                  }
                }
              }
            }
          }
        }

        factory {
          workflowBranchProjectFactory {
            scriptPath('Jenkinsfile')
          }
        }

        // Indexación periódica de respaldo por si un webhook se pierde.
        // El disparo principal es el webhook de GitHub (/github-webhook/).
        triggers {
          periodicFolderTrigger {
            interval('1h')
          }
        }

        orphanedItemStrategy {
          discardOldItems {
            numToKeep(20)
          }
        }
      }
