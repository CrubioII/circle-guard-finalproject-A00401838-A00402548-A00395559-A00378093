spring:
  application:
    name: circleguard-auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_auth
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  ldap:
    urls: ldap://localhost:389
    base: dc=circleguard,dc=edu
    username: cn=admin,dc=circleguard,dc=edu
    password: admin

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  # Milisegundos: 60 s, igual que el "expiresIn" que anuncia QrTokenController
  # y el ciclo de rotacion del cliente (mobile/hooks/useQrToken.ts).
  expiration: 60000

server:
  port: 8180

# US-23 (SCRUM-92): llamada a identity-service. URL, timeouts y umbrales se pueden
# cambiar por ambiente con variables de entorno, sin recompilar (External Configuration).
identity:
  service:
    url: ${IDENTITY_SERVICE_URL:http://localhost:8083}
    connect-timeout: ${IDENTITY_CONNECT_TIMEOUT:1s}
    read-timeout: ${IDENTITY_READ_TIMEOUT:2s}

resilience4j:
  retry:
    instances:
      identityService:
        max-attempts: ${IDENTITY_RETRY_MAX_ATTEMPTS:3}
        wait-duration: ${IDENTITY_RETRY_WAIT:200ms}
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        # Solo fallos transitorios: caída de red/timeout o 5xx. Un 4xx no se reintenta.
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException
  circuitbreaker:
    instances:
      identityService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: ${IDENTITY_CB_WINDOW:10}
        minimum-number-of-calls: ${IDENTITY_CB_MIN_CALLS:5}
        failure-rate-threshold: ${IDENTITY_CB_FAILURE_RATE:50}
        wait-duration-in-open-state: ${IDENTITY_CB_OPEN_WAIT:30s}
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        record-exceptions:
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

management:
  # US-24 (SCRUM-93): etiquetas comunes para distinguir servicio y ambiente en Prometheus/Grafana
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${CG_ENVIRONMENT:${spring.profiles.active:local}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Prueba de humo del pipeline (2026-11-26): fuerza el build de auth-service en Jenkins.
