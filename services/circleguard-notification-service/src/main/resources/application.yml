spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  expiration: 300

server:
  port: 8082

# Feature toggles (US-41). Defaults keep every channel on; turn one off per environment
# with its environment variable, e.g. FEATURE_SMS_NOTIFICATIONS=false.
circleguard:
  features:
    email-notifications: ${FEATURE_EMAIL_NOTIFICATIONS:true}
    sms-notifications: ${FEATURE_SMS_NOTIFICATIONS:true}
    push-notifications: ${FEATURE_PUSH_NOTIFICATIONS:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,features
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP is an external, optional channel: do not fail health (nor app context in tests) because of it.
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
