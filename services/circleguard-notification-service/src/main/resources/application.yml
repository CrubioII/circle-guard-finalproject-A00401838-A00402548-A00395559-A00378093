spring:
  application:
    name: circleguard-notification-service
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

auth:
  api:
    url: ${AUTH_API_URL:http://localhost:8180}

jwt:
  secret: "my-super-secret-dev-key-32-chars-long-12345678"
  expiration: 3600000

qr:
  secret: "my-qr-secret-key-for-dev-1234567890"
  expiration: 300

server:
  port: 8082

# Retry + Dead Letter Topic for the Kafka listeners (US-40): a failing message is retried
# max-retries times, then published to <topic>.DLT.
circleguard:
  kafka:
    dlq:
      retry-interval-ms: ${KAFKA_DLQ_RETRY_INTERVAL_MS:1000}
      max-retries: ${KAFKA_DLQ_MAX_RETRIES:2}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    # SMTP is an external, optional channel: do not fail health (nor app context in tests) because of it.
    mail:
      enabled: false
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
