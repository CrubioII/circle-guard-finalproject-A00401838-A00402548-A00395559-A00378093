spring:
  application:
    name: circleguard-form-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_form
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    # US-25 (SCRUM-94): el productor escribe el contexto de traza (traceparent) en los headers
    # del mensaje y el consumidor lo lee, así la traza sigue a través de Kafka.
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8086

management:
  # US-25 (SCRUM-94): trazas OpenTelemetry enviadas por OTLP/HTTP a Jaeger
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  # US-24 (SCRUM-93): etiquetas comunes para distinguir servicio y ambiente en Prometheus/Grafana
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${CG_ENVIRONMENT:${spring.profiles.active:local}}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
