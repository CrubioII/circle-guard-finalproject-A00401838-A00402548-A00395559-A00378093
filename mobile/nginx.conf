# =============================================================================
# CircleGuard Web Client - Unprivileged Nginx SPA Configuration (US-07)
# Runs on port 8080 under non-root UID 101 (nginxinc/nginx-unprivileged).
# =============================================================================

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Do not expose Nginx version in headers or error pages
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip compression for exported web bundle
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        image/svg+xml;

    # Lightweight HTTP healthcheck endpoint (CA2)
    location = /healthz {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"UP","service":"circleguard-web"}\n';
    }

    # Dynamic runtime configuration generated at container startup (CA3)
    location = /runtime-config.js {
        alias /tmp/circleguard-runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires -1;
    }

    # Hashed static assets exported by Metro / Expo
    location /_expo/static/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routing fallback for Expo Router static & dynamic routes (CA2)
    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ /index.html;
    }
}
