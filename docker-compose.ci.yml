# =============================================================================
# Orquestación del plano de control CI/CD — CircleGuard (US-04 / SCRUM-16 / SCRUM-40)
# Servicios:
#   1. jenkins      (Jenkins LTS + JDK 21 + Gradle 8.5 + Docker CLI + Node 20 / Playwright deps)
#   2. sonarqube-db (PostgreSQL 16 dedicado a SonarQube)
#   3. sonarqube    (SonarQube 10.6 Community Edition)
#   4. nexus        (Sonatype Nexus Repository OSS 3 + conector Docker Registry en puerto 5000)
#
# Ejecución directa:
#   docker compose -f docker-compose.ci.yml --env-file infra/bootstrap/.env.ci up -d --build
# Aprovisionamiento completo e idempotente desde cero:
#   sudo bash infra/bootstrap/bootstrap-ci.sh
# =============================================================================

name: circleguard-ci

services:
  jenkins:
    build:
      context: ./infra/bootstrap/jenkins
      dockerfile: Dockerfile
    image: circleguard/jenkins-ci:2.580.2-jdk21
    container_name: circleguard-jenkins
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "${JENKINS_HTTP_PORT:-8080}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      JAVA_OPTS: "${JENKINS_JAVA_OPTS:--Djenkins.install.runSetupWizard=false -Dhudson.model.DirectoryBrowserSupport.CSP= -Xms512m -Xmx1024m}"
      CASC_JENKINS_CONFIG: "/var/jenkins_home/casc_configs/jenkins.yaml"
      JENKINS_URL: "${JENKINS_URL:-http://localhost:8080/}"
      SONAR_HOST_URL: "${SONAR_HOST_URL:-http://sonarqube:9000}"
      NEXUS_URL: "${NEXUS_URL:-http://nexus:8081}"
      DOCKER_REGISTRY_URL: "${DOCKER_REGISTRY_URL:-localhost:5000}"
      # US-13 / US-31: hosts de los ambientes y aprobadores de prod (no son secretos).
      # jenkins/ci/jenkins.yaml los publica como variables globales de Jenkins.
      CG_DEV_HOST: "${CG_DEV_HOST:-52.15.165.116}"
      CG_STAGE_HOST: "${CG_STAGE_HOST:-52.14.89.125}"
      CG_PROD_HOST: "${CG_PROD_HOST:-77.113.211.62}"
      CG_REGISTRY_URL: "${CG_REGISTRY_URL:-18.117.90.15:5000}"
      CG_PROD_APPROVERS: "${CG_PROD_APPROVERS:-}"
      CG_PROD_APPROVAL_TIMEOUT_MIN: "${CG_PROD_APPROVAL_TIMEOUT_MIN:-60}"
      # US-31: el entrypoint no arranca Jenkins si falta alguno de estos secretos.
      CG_REQUIRED_SECRETS: "JENKINS_ADMIN_PASSWORD JENKINS_PWD_JRUBIO JENKINS_PWD_ECUELLAR JENKINS_PWD_SCASTILLO JENKINS_PWD_JPORDONEZ JENKINS_PWD_DOCENTE"
    # US-31: las contraseñas de las cuentas llegan como archivos en /run/secrets (JCasC los
    # resuelve como ${NOMBRE}) y no como variables de entorno: así un `sh 'env'` de cualquier
    # build no las imprime y no aparecen en `docker inspect`.
    secrets:
      - JENKINS_ADMIN_PASSWORD
      - JENKINS_PWD_JRUBIO
      - JENKINS_PWD_ECUELLAR
      - JENKINS_PWD_SCASTILLO
      - JENKINS_PWD_JPORDONEZ
      - JENKINS_PWD_DOCENTE
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./jenkins/ci/jenkins.yaml:/var/jenkins_home/casc_configs/jenkins.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - ci-network

  sonarqube-db:
    image: postgres:16.4-alpine
    container_name: circleguard-sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${SONAR_DB_USER:-sonar}"
      POSTGRES_PASSWORD: "${SONAR_DB_PASSWORD:-change_me_sonar_db_password}"
      POSTGRES_DB: "${SONAR_DB_NAME:-sonarqube}"
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SONAR_DB_USER:-sonar} -d ${SONAR_DB_NAME:-sonarqube}"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - ci-network

  sonarqube:
    image: sonarqube:10.6.0-community
    container_name: circleguard-sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    ports:
      - "${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_JDBC_URL: "jdbc:postgresql://sonarqube-db:5432/${SONAR_DB_NAME:-sonarqube}"
      SONAR_JDBC_USERNAME: "${SONAR_DB_USER:-sonar}"
      SONAR_JDBC_PASSWORD: "${SONAR_DB_PASSWORD:-change_me_sonar_db_password}"
      SONAR_SEARCH_JAVAADDITIONALOPTS: "${SONAR_SEARCH_OPTS:--Xms512m -Xmx512m}"
      SONAR_WEB_JAVAADDITIONALOPTS: "${SONAR_WEB_OPTS:--Xms256m -Xmx512m}"
      SONAR_CE_JAVAADDITIONALOPTS: "${SONAR_CE_OPTS:--Xms256m -Xmx512m}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/api/system/status | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - ci-network

  nexus:
    image: sonatype/nexus3:3.70.1
    container_name: circleguard-nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_HTTP_PORT:-8081}:8081"
      - "${NEXUS_DOCKER_REGISTRY_PORT:-5000}:5000"
    environment:
      INSTALL4J_ADD_VM_PARAMS: "${NEXUS_JVM_OPTS:--Xms512m -Xmx768m -XX:MaxDirectMemorySize=1024m -Djava.util.prefs.userRoot=/nexus-data/javaprefs}"
    volumes:
      - nexus_data:/nexus-data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/service/rest/v1/status >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 15
      start_period: 120s
    networks:
      - ci-network

volumes:
  jenkins_home:
    name: circleguard_jenkins_home
  sonarqube_db_data:
    name: circleguard_sonarqube_db_data
  sonarqube_data:
    name: circleguard_sonarqube_data
  sonarqube_extensions:
    name: circleguard_sonarqube_extensions
  sonarqube_logs:
    name: circleguard_sonarqube_logs
  nexus_data:
    name: circleguard_nexus_data

networks:
  ci-network:
    name: circleguard_ci_network
    driver: bridge

# US-31: contraseñas de las cuentas de Jenkins. Se toman de infra/bootstrap/.env.ci
# (--env-file), que bootstrap-ci.sh genera con permisos 0600 y nunca se versiona.
secrets:
  JENKINS_ADMIN_PASSWORD:
    environment: JENKINS_ADMIN_PASSWORD
  JENKINS_PWD_JRUBIO:
    environment: JENKINS_PWD_JRUBIO
  JENKINS_PWD_ECUELLAR:
    environment: JENKINS_PWD_ECUELLAR
  JENKINS_PWD_SCASTILLO:
    environment: JENKINS_PWD_SCASTILLO
  JENKINS_PWD_JPORDONEZ:
    environment: JENKINS_PWD_JPORDONEZ
  JENKINS_PWD_DOCENTE:
    environment: JENKINS_PWD_DOCENTE
