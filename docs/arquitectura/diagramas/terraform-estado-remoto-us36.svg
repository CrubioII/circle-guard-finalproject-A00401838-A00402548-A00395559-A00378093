<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900" font-family="Helvetica, Arial, sans-serif">
  <title>CircleGuard: estado remoto de Terraform con bloqueo (US-36)</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5454E9"/>
    </marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E8B57"/>
    </marker>
    <marker id="aR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C2410C"/>
    </marker>
  </defs>
  <rect width="1400" height="900" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1A1A1A">CircleGuard: estado remoto de Terraform con bloqueo (US-36)</text>
  <text x="30" y="63" font-size="13" fill="#6B7280">Un bucket S3 guarda el estado de cada raíz de Terraform. Cada ejecución bloquea su clave con un archivo .tflock (bloqueo nativo de S3, sin DynamoDB). AWS us-east-2.</text>

  <!-- Quién ejecuta Terraform -->
  <g font-size="12" fill="#374151">
    <rect x="30" y="100" width="250" height="58" rx="29" fill="#F9FAFB" stroke="#9CA3AF"/>
    <text x="155" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Ejecución A</text>
    <text x="155" y="143" text-anchor="middle">integrante del equipo o pipeline</text>

    <rect x="30" y="176" width="250" height="58" rx="29" fill="#F9FAFB" stroke="#9CA3AF"/>
    <text x="155" y="201" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Ejecución B</text>
    <text x="155" y="219" text-anchor="middle">otra persona, al mismo tiempo</text>

    <rect x="30" y="270" width="250" height="150" rx="8" fill="#FFFFFF" stroke="#5454E9"/>
    <text x="45" y="294" font-size="13" font-weight="bold" fill="#1A1A1A">Terraform 1.14 · backend "s3"</text>
    <text x="45" y="316">backend.hcl (generado por</text>
    <text x="45" y="333">  init-backend.sh, ignorado por Git)</text>
    <text x="45" y="355">use_lockfile = true</text>
    <text x="45" y="373">encrypt      = true</text>
    <text x="45" y="395">Credenciales: AWS_PROFILE</text>
    <text x="45" y="411">  (nunca en el repositorio)</text>

    <rect x="30" y="460" width="250" height="160" rx="8" fill="#F0FAF4" stroke="#4CB978"/>
    <text x="45" y="484" font-size="13" font-weight="bold" fill="#1A1A1A">infra/terraform/bootstrap</text>
    <text x="45" y="506">Crea el bucket y sus 6 controles</text>
    <text x="45" y="524">(7 recursos).</text>
    <text x="45" y="546">bootstrap-backend.sh:</text>
    <text x="45" y="564">  1. apply con estado local</text>
    <text x="45" y="582">  2. init -migrate-state al bucket</text>
    <text x="45" y="600">  3. borra la copia local</text>
  </g>
  <line x1="155" y1="158" x2="155" y2="174" stroke="#9CA3AF"/>
  <line x1="155" y1="234" x2="155" y2="266" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Bucket de estado -->
  <rect x="340" y="90" width="560" height="620" rx="12" fill="#F5F5FF" stroke="#5454E9" stroke-width="1.5"/>
  <text x="360" y="116" font-size="15" font-weight="bold" fill="#5454E9">Amazon S3 · circleguard-terraform-state-&lt;ID_CUENTA&gt;</text>
  <text x="360" y="136" font-size="12" fill="#5454E9">Un solo bucket compartido por los tres ambientes · us-east-2</text>

  <g font-size="12" fill="#374151">
    <rect x="360" y="152" width="520" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="375" y="174" font-size="13" font-weight="bold" fill="#1A1A1A">bootstrap/terraform.tfstate</text>
    <text x="375" y="193">Estado del propio bucket (7 recursos)</text>

    <rect x="360" y="216" width="520" height="70" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="375" y="238" font-size="13" font-weight="bold" fill="#1A1A1A">envs/dev/platform.tfstate</text>
    <text x="375" y="257">Red, cómputo k3s, ECR, S3 y observabilidad de dev (98 recursos)</text>
    <rect x="375" y="265" width="300" height="16" rx="3" fill="#FFF4EC" stroke="#E8833A"/>
    <text x="383" y="277" font-size="11" fill="#C2410C">envs/dev/platform.tfstate.tflock (solo durante una ejecución)</text>

    <rect x="360" y="298" width="520" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="375" y="320" font-size="13" font-weight="bold" fill="#1A1A1A">envs/stage/platform.tfstate</text>
    <text x="375" y="339">Mismo código, valores de stage (98 recursos)</text>

    <rect x="360" y="362" width="520" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="375" y="384" font-size="13" font-weight="bold" fill="#1A1A1A">envs/prod/platform.tfstate</text>
    <text x="375" y="403">Mismo código, valores de prod (111 recursos)</text>

    <rect x="360" y="426" width="520" height="52" rx="6" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="5 4"/>
    <text x="375" y="448" font-size="13" font-weight="bold" fill="#1A1A1A">tests/state-lock/terraform.tfstate</text>
    <text x="375" y="467">Prueba de CA2 (test-state-lock.sh); se borra con todas sus versiones</text>

    <rect x="360" y="494" width="520" height="200" rx="8" fill="#FFFFFF" stroke="#5454E9"/>
    <text x="375" y="518" font-size="13" font-weight="bold" fill="#1A1A1A">Controles del bucket</text>
    <text x="375" y="542">Versionado: cada escritura deja una versión</text>
    <text x="375" y="560">  recuperable del estado</text>
    <text x="375" y="584">Cifrado SSE-S3 (AES256) por defecto</text>
    <text x="375" y="608">Bloqueo total de acceso público</text>
    <text x="375" y="632">Sin ACL (BucketOwnerEnforced)</text>
    <text x="630" y="542">Política: rechaza HTTP y TLS &lt; 1.2</text>
    <text x="630" y="566">Ciclo de vida: versiones anteriores</text>
    <text x="630" y="584">  90 días, siempre quedan 10</text>
    <text x="630" y="608">prevent_destroy y force_destroy = false</text>
    <text x="630" y="632">Acceso con IAM: ReadOnlyAccess +</text>
    <text x="630" y="650">  s3:* solo sobre este bucket</text>
    <text x="375" y="680" fill="#6B7280">Las raíces no comparten clave: un bloqueo en dev no detiene a stage ni a prod.</text>
  </g>

  <!-- Flechas hacia el bucket -->
  <line x1="280" y1="320" x2="356" y2="250" stroke="#5454E9" stroke-width="1.5" marker-end="url(#aB)"/>
  <text x="290" y="268" font-size="11" fill="#5454E9" transform="rotate(-42 290 268)">HTTPS</text>
  <line x1="280" y1="540" x2="356" y2="180" stroke="#2E8B57" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#aG)"/>

  <!-- Secuencia del bloqueo -->
  <text x="940" y="116" font-size="15" font-weight="bold" fill="#1A1A1A">Bloqueo de una misma clave (CA2)</text>
  <text x="940" y="136" font-size="12" fill="#6B7280">Resultado real de test-state-lock.sh</text>

  <g font-size="12" fill="#374151">
    <rect x="940" y="152" width="430" height="88" rx="8" fill="#F0FAF4" stroke="#4CB978"/>
    <text x="955" y="176" font-size="13" font-weight="bold" fill="#1A1A1A">1. A ejecuta apply</text>
    <text x="955" y="196">Crea &lt;clave&gt;.tflock con escritura condicional</text>
    <text x="955" y="214">(If-None-Match). Contiene ID, operación y fecha.</text>
    <text x="955" y="232">El objeto solo se crea si no existe.</text>

    <rect x="940" y="262" width="430" height="108" rx="8" fill="#FFF4EC" stroke="#E8833A"/>
    <text x="955" y="286" font-size="13" font-weight="bold" fill="#1A1A1A">2. B ejecuta apply o plan sobre la misma clave</text>
    <text x="955" y="306">S3 rechaza la escritura del .tflock (412).</text>
    <text x="955" y="324" font-family="Consolas, Menlo, monospace" fill="#C2410C">Error: Error acquiring the state lock</text>
    <text x="955" y="342">B se detiene sin leer ni escribir el estado.</text>
    <text x="955" y="360">Con -lock-timeout=10s reintenta y luego falla igual.</text>

    <rect x="940" y="392" width="430" height="88" rx="8" fill="#F0FAF4" stroke="#4CB978"/>
    <text x="955" y="416" font-size="13" font-weight="bold" fill="#1A1A1A">3. A termina</text>
    <text x="955" y="436">Escribe el estado (nueva versión en S3)</text>
    <text x="955" y="454">y borra el .tflock.</text>
    <text x="955" y="472">El estado queda escrito solo por A.</text>

    <rect x="940" y="502" width="430" height="70" rx="8" fill="#F0FAF4" stroke="#4CB978"/>
    <text x="955" y="526" font-size="13" font-weight="bold" fill="#1A1A1A">4. B reintenta</text>
    <text x="955" y="546">Toma el bloqueo, parte del estado que dejó A</text>
    <text x="955" y="564">y aplica. Nunca hay dos escrituras a la vez.</text>
  </g>
  <line x1="1155" y1="240" x2="1155" y2="258" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1155" y1="370" x2="1155" y2="388" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="1155" y1="480" x2="1155" y2="498" stroke="#374151" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="900" y1="273" x2="936" y2="300" stroke="#C2410C" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#aR)"/>

  <g font-size="12" fill="#374151">
    <rect x="940" y="600" width="430" height="110" rx="8" fill="#F9FAFB" stroke="#9CA3AF"/>
    <text x="955" y="624" font-size="13" font-weight="bold" fill="#1A1A1A">Si una ejecución se interrumpe</text>
    <text x="955" y="646">El .tflock queda en el bucket y bloquea la clave.</text>
    <text x="955" y="664">Tras confirmar que nadie más está aplicando:</text>
    <text x="955" y="684" font-family="Consolas, Menlo, monospace">terraform force-unlock &lt;ID del bloqueo&gt;</text>
    <text x="955" y="702" fill="#6B7280">Un estado dañado se restaura desde una versión anterior.</text>
  </g>

  <!-- Pie -->
  <rect x="30" y="740" width="1340" height="130" rx="8" fill="#F9FAFB" stroke="#E5E7EB"/>
  <g font-size="12" fill="#374151">
    <text x="50" y="766" font-size="13" font-weight="bold" fill="#1A1A1A">Flujo de trabajo</text>
    <text x="50" y="790">1. bash infra/terraform/scripts/bootstrap-backend.sh --profile &lt;perfil&gt;    (una vez por cuenta; idempotente)</text>
    <text x="50" y="810">2. bash infra/terraform/scripts/init-backend.sh --profile &lt;perfil&gt;           (genera backend.hcl en bootstrap, dev, stage y prod)</text>
    <text x="50" y="830">3. AWS_PROFILE=&lt;perfil&gt; bash infra/terraform/scripts/plan-all.sh --real    (init, validate y plan de los tres ambientes con el backend remoto)</text>
    <text x="50" y="850">4. bash infra/terraform/scripts/test-state-lock.sh --profile &lt;perfil&gt;      (evidencia de CA2 en reports/terraform/state-lock-test.txt)</text>
  </g>
</svg>
