    <rect x="45" y="132" width="240" height="64" rx="32" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="165" y="158" font-size="13" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Equipo de plataforma</text>
    <text x="165" y="176" text-anchor="middle">terraform + AWS_PROFILE</text>
    <rect x="45" y="226" width="240" height="96" rx="8" fill="#FFFFFF" stroke="#9CA3AF"/>
    <text x="60" y="250" font-size="13" font-weight="bold" fill="#1A1A1A">IAM: usuario de Terraform</text>
    <text x="60" y="270">ReadOnlyAccess (plan)</text>
    <text x="60" y="288">s3:* solo en el bucket de estado</text>
    <text x="60" y="306" fill="#6B7280">Creado a mano, fuera de Terraform</text>
    <rect x="45" y="352" width="240" height="240" rx="8" fill="#F5F5FF" stroke="#5454E9" stroke-width="1.5"/>
    <text x="60" y="376" font-size="13" font-weight="bold" fill="#5454E9">S3: estado de Terraform (US-36)</text>
    <text x="60" y="396">circleguard-terraform-state-</text>
    <text x="60" y="412">  &lt;ID_CUENTA&gt;</text>
    <text x="60" y="436">bootstrap/terraform.tfstate</text>
    <text x="60" y="454">envs/dev/platform.tfstate</text>
    <text x="60" y="472">envs/stage/platform.tfstate</text>
    <text x="60" y="490">envs/prod/platform.tfstate</text>
    <text x="60" y="514">Bloqueo: &lt;clave&gt;.tflock</text>
    <text x="60" y="532">Versionado · SSE-S3 · solo TLS</text>
    <text x="60" y="550">Sin acceso público · 7 recursos</text>
    <text x="60" y="574" fill="#6B7280">infra/terraform/bootstrap</text>
    <rect x="45" y="622" width="240" height="138" rx="8" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="5 4"/>
    <text x="60" y="646" font-size="13" font-weight="bold" fill="#1A1A1A">CI de la Parte 1</text>
    <text x="60" y="666">EC2 con Jenkins, SonarQube</text>
    <text x="60" y="684">y Nexus (fuera de Terraform)</text>
    <text x="60" y="708">Valida Terraform y Kubernetes</text>
    <text x="60" y="726">sin credenciales de AWS</text>
    <text x="60" y="744" fill="#6B7280">plan-all.sh · validate.sh</text>
    <rect x="45" y="790" width="240" height="226" rx="8" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text x="60" y="814" font-size="13" font-weight="bold" fill="#1A1A1A">Historias</text>
    <text x="60" y="836">US-20  red y cómputo k3s</text>
    <text x="60" y="856">US-35  ECR, S3 y observabilidad</text>
    <text x="60" y="876">US-21  namespaces y middleware</text>
    <text x="60" y="896">US-36  estado remoto y bloqueo</text>
    <rect x="60" y="916" width="14" height="14" fill="#F5F5FF" stroke="#5454E9"/><text x="82" y="928">red (VPC)</text>
    <rect x="60" y="938" width="14" height="14" fill="#F0FAF4" stroke="#4CB978"/><text x="82" y="950">cómputo y Kubernetes</text>
    <rect x="60" y="960" width="14" height="14" fill="#FFF8E6" stroke="#D4A017"/><text x="82" y="972">servicios administrados</text>
    <rect x="60" y="982" width="14" height="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-dasharray="3 2"/><text x="82" y="994">fuera de Terraform</text>
  </g>
