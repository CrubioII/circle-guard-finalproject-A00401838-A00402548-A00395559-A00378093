  <rect width="1400" height="1060" fill="#FFFFFF"/>
  <text x="30" y="40" font-size="22" font-weight="bold" fill="#1A1A1A">CircleGuard: infraestructura AWS declarada con Terraform</text>
  <text x="30" y="63" font-size="13" fill="#6B7280">Estado tras US-36. Mismo código para los tres ambientes; solo cambia terraform.tfvars. Recursos según terraform plan real del 2026-11-22 (aún sin apply). AWS us-east-2.</text>
  <rect x="30" y="90" width="270" height="940" rx="12" fill="#F9FAFB" stroke="#9CA3AF"/>
  <text x="48" y="116" font-size="15" font-weight="bold" fill="#1A1A1A">Compartido por la cuenta</text>
