<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 880" width="1400" height="880" font-family="Helvetica, Arial, sans-serif">
  <title>CircleGuard: arquitectura lógica de microservicios (Parte 1)</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#865CF0"/>
    </marker>
  </defs>
  <rect width="1400" height="880" fill="#FFFFFF"/>

  <text x="40" y="42" font-size="22" font-weight="bold" fill="#1A1A1A">CircleGuard: arquitectura lógica de microservicios (Parte 1)</text>
  <text x="40" y="66" font-size="13" fill="#6B7280">Lo mismo se despliega en dev, stage y prod con deploy/compose/docker-compose.&lt;env&gt;.yml (12 contenedores por ambiente)</text>

  <!-- Usuarios -->
  <rect x="450" y="88" width="500" height="44" rx="22" fill="#F9FAFB" stroke="#9CA3AF"/>
  <text x="700" y="115" font-size="14" text-anchor="middle" fill="#1A1A1A">Usuarios: estudiantes, personal de salud y guardias de acceso (navegador)</text>
  <line x1="700" y1="132" x2="700" y2="160" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- Cliente web -->
  <rect x="450" y="162" width="500" height="70" rx="8" fill="#EEF0FD" stroke="#5454E9" stroke-width="2"/>
  <text x="700" y="188" font-size="16" font-weight="bold" text-anchor="middle" fill="#1A1A1A">web-client  :8080</text>
  <text x="700" y="207" font-size="12" text-anchor="middle" fill="#374151">Expo (React Native) exportado a web, servido por nginx no root</text>
  <text x="700" y="223" font-size="12" text-anchor="middle" fill="#374151">/healthz · /runtime-config.js con las URLs de cada ambiente</text>

  <!-- Abanico web -> servicios -->
  <g stroke="#374151" stroke-width="1.4" fill="none" marker-end="url(#arr)">
    <path d="M700,232 L700,250 L200,250 L200,288"/>
    <path d="M700,250 L450,250 L450,288"/>
    <path d="M700,232 L700,288"/>
    <path d="M700,250 L950,250 L950,288"/>
    <path d="M700,250 L1200,250 L1200,288"/>
  </g>
  <text x="962" y="244" font-size="12" fill="#374151">HTTP/JSON + JWT Bearer</text>

  <!-- Servicios núcleo -->
  <g font-size="12" fill="#374151">
    <rect x="100" y="290" width="200" height="122" rx="8" fill="#FFFFFF" stroke="#5454E9" stroke-width="2"/>
    <text x="200" y="314" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">auth-service</text>
    <text x="200" y="331" text-anchor="middle" fill="#5454E9" font-weight="bold">:8180</text>
    <text x="200" y="352" text-anchor="middle">Login dual LDAP / local</text>
    <text x="200" y="368" text-anchor="middle">JWT, RBAC y QR firmado</text>
    <text x="200" y="398" text-anchor="middle" fill="#6B7280">PostgreSQL · OpenLDAP</text>

    <rect x="350" y="290" width="200" height="122" rx="8" fill="#FFFFFF" stroke="#5454E9" stroke-width="2"/>
    <text x="450" y="314" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">identity-service</text>
    <text x="450" y="331" text-anchor="middle" fill="#5454E9" font-weight="bold">:8083</text>
    <text x="450" y="352" text-anchor="middle">Bóveda de identidades</text>
    <text x="450" y="368" text-anchor="middle">real ↔ anonymousId (hash)</text>
    <text x="450" y="398" text-anchor="middle" fill="#6B7280">PostgreSQL</text>

    <rect x="600" y="290" width="200" height="122" rx="8" fill="#FFFFFF" stroke="#5454E9" stroke-width="2"/>
    <text x="700" y="314" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">promotion-service</text>
    <text x="700" y="331" text-anchor="middle" fill="#5454E9" font-weight="bold">:8088</text>
    <text x="700" y="352" text-anchor="middle">Sospechoso → Probable →</text>
    <text x="700" y="368" text-anchor="middle">Confirmado; cercos (Circles)</text>
    <text x="700" y="398" text-anchor="middle" fill="#6B7280">PostgreSQL · Neo4j · Redis</text>

    <rect x="850" y="290" width="200" height="122" rx="8" fill="#FFFFFF" stroke="#5454E9" stroke-width="2"/>
    <text x="950" y="314" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">form-service</text>
    <text x="950" y="331" text-anchor="middle" fill="#5454E9" font-weight="bold">:8086</text>
    <text x="950" y="352" text-anchor="middle">Cuestionarios de salud</text>
    <text x="950" y="368" text-anchor="middle">y certificados</text>
    <text x="950" y="398" text-anchor="middle" fill="#6B7280">PostgreSQL</text>

    <rect x="1100" y="290" width="200" height="122" rx="8" fill="#FFFFFF" stroke="#5454E9" stroke-width="2"/>
    <text x="1200" y="314" font-size="15" font-weight="bold" text-anchor="middle" fill="#1A1A1A">gateway-service</text>
    <text x="1200" y="331" text-anchor="middle" fill="#5454E9" font-weight="bold">:8087</text>
    <text x="1200" y="352" text-anchor="middle">Valida en el ingreso el QR</text>
    <text x="1200" y="368" text-anchor="middle">firmado y vigente (60 s)</text>
    <text x="1200" y="398" text-anchor="middle" fill="#6B7280">Redis</text>
  </g>

  <!-- auth -> identity -->
  <line x1="300" y1="345" x2="348" y2="345" stroke="#374151" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="325" y="338" font-size="11" text-anchor="middle" fill="#374151">REST</text>

  <!-- Flechas Kafka -->
  <g stroke="#865CF0" stroke-width="1.8" fill="none">
    <line x1="450" y1="412" x2="450" y2="470" marker-end="url(#arrK)"/>
    <line x1="700" y1="414" x2="700" y2="470" marker-start="url(#arrK)" marker-end="url(#arrK)"/>
    <line x1="950" y1="412" x2="950" y2="470" marker-end="url(#arrK)"/>
    <line x1="1180" y1="572" x2="1180" y2="626" marker-end="url(#arrK)"/>
  </g>

  <!-- Bus Kafka -->
  <rect x="100" y="472" width="1200" height="100" rx="8" fill="#F3EEFE" stroke="#865CF0" stroke-width="2"/>
  <text x="120" y="497" font-size="15" font-weight="bold" fill="#1A1A1A">Apache Kafka 7.6 + Zookeeper: eventos asíncronos (listener interno kafka:29092)</text>
  <g font-size="12.5" fill="#374151">
    <text x="120" y="519"><tspan font-weight="bold">form-service</tspan>  →  survey.submitted, certificate.validated  →  <tspan font-weight="bold">promotion-service</tspan></text>
    <text x="120" y="539"><tspan font-weight="bold">promotion-service</tspan>  →  promotion.status.changed, circle.fenced, alert.priority  →  <tspan font-weight="bold">notification-service</tspan></text>
    <text x="120" y="559"><tspan font-weight="bold">identity-service</tspan>  →  audit.identity.accessed (auditoría de accesos a la bóveda)</text>
  </g>

  <!-- Middleware de datos -->
  <text x="100" y="612" font-size="13" font-weight="bold" fill="#1A1A1A">Middleware de datos (red interna circleguard_&lt;env&gt;_net; en stage y prod no se publica en el host)</text>
  <g font-size="12" fill="#374151">
    <rect x="100" y="626" width="215" height="84" rx="8" fill="#FEF0E8" stroke="#F0681A" stroke-width="2"/>
    <text x="207" y="651" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">PostgreSQL 16.4</text>
    <text x="207" y="672" text-anchor="middle">Una BD por servicio: auth,</text>
    <text x="207" y="689" text-anchor="middle">identity, promotion y form</text>

    <rect x="335" y="626" width="215" height="84" rx="8" fill="#FEF0E8" stroke="#F0681A" stroke-width="2"/>
    <text x="442" y="651" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Neo4j 5.26</text>
    <text x="442" y="672" text-anchor="middle">Grafo de contactos con</text>
    <text x="442" y="689" text-anchor="middle">ventana temporal de 14 días</text>

    <rect x="570" y="626" width="215" height="84" rx="8" fill="#FEF0E8" stroke="#F0681A" stroke-width="2"/>
    <text x="677" y="651" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">Redis 7.2.5</text>
    <text x="677" y="672" text-anchor="middle">Validación de QR y caché</text>
    <text x="677" y="689" text-anchor="middle">del estado de salud</text>

    <rect x="805" y="626" width="215" height="84" rx="8" fill="#FEF0E8" stroke="#F0681A" stroke-width="2"/>
    <text x="912" y="651" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A1A1A">OpenLDAP 1.5.0</text>
    <text x="912" y="672" text-anchor="middle">Directorio universitario</text>
    <text x="912" y="689" text-anchor="middle">(cadena LDAP del login)</text>
  </g>

  <!-- Complementarios -->
  <rect x="1060" y="628" width="240" height="150" rx="8" fill="#F9FAFB" stroke="#6B7280" stroke-width="1.6" stroke-dasharray="7 5"/>
  <g font-size="12" fill="#374151">
    <text x="1076" y="652" font-size="14" font-weight="bold" fill="#1A1A1A">Servicios complementarios</text>
    <text x="1076" y="671">Compilados, probados y publicados</text>
    <text x="1076" y="687">en P1; se despliegan en la Parte 2</text>
    <text x="1076" y="712"><tspan font-weight="bold">notification</tspan> :8082 (consume Kafka)</text>
    <text x="1076" y="732"><tspan font-weight="bold">file</tspan> :8085 (compatible con S3)</text>
    <text x="1076" y="752"><tspan font-weight="bold">dashboard</tspan> :8084 (REST → promotion)</text>
  </g>

  <!-- Leyenda -->
  <g font-size="12" fill="#374151">
    <rect x="100" y="742" width="22" height="14" rx="3" fill="#FFFFFF" stroke="#5454E9" stroke-width="2"/>
    <text x="130" y="754">Desplegado en dev, stage y prod (imagen circleguard/&lt;svc&gt;:X.Y.Z, healthcheck /actuator/health/readiness)</text>
    <rect x="100" y="766" width="22" height="14" rx="3" fill="#FEF0E8" stroke="#F0681A" stroke-width="2"/>
    <text x="130" y="778">Middleware con versión fija y healthcheck funcional (pg_isready, cypher-shell, redis-cli ping, ldapwhoami)</text>
    <line x1="100" y1="797" x2="122" y2="797" stroke="#865CF0" stroke-width="2"/>
    <text x="130" y="801">Evento Kafka</text>
    <line x1="230" y1="797" x2="252" y2="797" stroke="#374151" stroke-width="1.6"/>
    <text x="260" y="801">Llamada HTTP síncrona</text>
    <rect x="420" y="790" width="22" height="14" rx="3" fill="#F9FAFB" stroke="#6B7280" stroke-dasharray="4 3"/>
    <text x="450" y="801">Fuera del alcance de despliegue de la Parte 1</text>
  </g>
  <text x="100" y="850" font-size="11" fill="#6B7280">Fuentes: deploy/compose/docker-compose.{dev,stage,prod}.yml, services/*/src/main (KafkaTemplate y @KafkaListener), docs/arquitectura/COMPOSE_ENVIRONMENTS_US08.md</text>
</svg>
