# Prometheus + Grafana junto a un ambiente en Docker Compose (US-24 / SCRUM-93).
#
# Se une a la red del compose del ambiente (circleguard_<env>_net) para recoger
# las métricas por nombre de servicio. Los puertos quedan solo en 127.0.0.1 del
# nodo: se consultan con un túnel SSH (ver docs/operaciones/OBSERVABILIDAD_METRICAS_US24.md).
#
#   GRAFANA_ADMIN_PASSWORD=<contraseña> CG_ENV=dev \
#     docker compose -f observability/docker-compose.observability.yml up -d
name: circleguard-observability-${CG_ENV:-dev}

services:
  prometheus:
    image: prom/prometheus:v2.53.4
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus-compose.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [envnet]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD es obligatorio}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [envnet]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  envnet:
    external: true
    name: circleguard_${CG_ENV:-dev}_net
