# Pruebas de las reglas críticas de US-41 (SCRUM-122):
#   docker run --rm --entrypoint promtool -v "$PWD/observability/prometheus/rules:/r:ro" \
#     prom/prometheus:v2.53.4 test rules /r/tests/alertas-criticas.test.yml
rule_files:
  - ../alertas-criticas.yml

evaluation_interval: 15s

tests:
  # Un servicio caído dispara la alerta solo después de 1 minuto.
  - interval: 15s
    input_series:
      - series: 'up{job="circleguard-services", application="circleguard-gateway-service", instance="gateway-service:8087"}'
        values: "1 1 0 0 0 0 0 0"
    alert_rule_test:
      - eval_time: 45s
        alertname: CircleGuardServicioCaido
        exp_alerts: []
      - eval_time: 105s
        alertname: CircleGuardServicioCaido
        exp_alerts:
          - exp_labels:
              severity: critical
              team: plataforma
              job: circleguard-services
              application: circleguard-gateway-service
              instance: gateway-service:8087
            exp_annotations:
              summary: "circleguard-gateway-service (gateway-service:8087) no responde"
              description: "Prometheus no puede leer /actuator/prometheus de gateway-service:8087 desde hace más de 1 minuto."

  # 10 confirmados por minuto durante más de 2 minutos es un brote; 2 por minuto no.
  - interval: 1m
    input_series:
      - series: 'circleguard_promotions_total{status="CONFIRMED", environment="dev"}'
        values: "0+10x10"
      - series: 'circleguard_promotions_total{status="CONFIRMED", environment="stage"}'
        values: "0+2x10"
    alert_rule_test:
      - eval_time: 9m
        alertname: CircleGuardBroteDeConfirmados
        exp_alerts:
          - exp_labels:
              severity: critical
              team: salud
              environment: dev
            exp_annotations:
              summary: "Más de 5 casos confirmados por minuto en dev"
              description: "10 confirmados/min. Posible brote: revisar cercos y avisar al comité de salud."

  # Contención con p95 de 4.8 s (por encima de NFR-1) dispara la alerta.
  - interval: 1m
    input_series:
      - series: 'circleguard_containment_seconds_bucket{le="0.3", environment="dev"}'
        values: "0+0x10"
      - series: 'circleguard_containment_seconds_bucket{le="1.0", environment="dev"}'
        values: "0+0x10"
      - series: 'circleguard_containment_seconds_bucket{le="5.0", environment="dev"}'
        values: "0+60x10"
      - series: 'circleguard_containment_seconds_bucket{le="+Inf", environment="dev"}'
        values: "0+60x10"
    alert_rule_test:
      - eval_time: 9m
        alertname: CircleGuardContencionLenta
        exp_alerts:
          - exp_labels:
              severity: critical
              team: salud
              environment: dev
            exp_annotations:
              summary: "El p95 del tiempo de contención supera 1 s en dev"
              description: "p95 = 4.8s. El requisito NFR-1 pide cercar los contactos en menos de 1 s."
