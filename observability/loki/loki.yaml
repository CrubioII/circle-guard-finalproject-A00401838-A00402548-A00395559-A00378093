# Loki en modo monolítico (US-42 / SCRUM-123): un solo proceso, índice TSDB y
# chunks en el disco persistente del pod. La retención la aplica el compactor y
# llega por la variable LOKI_RETENTION_PERIOD que fija el overlay de cada ambiente
# (dev 7 d, stage 14 d, prod 30 d, igual que los log groups de CloudWatch).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-168h}
  max_query_lookback: ${LOKI_RETENTION_PERIOD:-168h}
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 8
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
